<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import Excel → SQL</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --tx:#1d2330; --mut:#6b7280; --bd:#d9dde3; --pri:#2563eb; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d222a; --tx:#e5e7eb; --mut:#9aa3b2; --bd:#343b47; --pri:#60a5fa; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.5 system-ui,Segoe UI,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:20px 16px 60px }
  h1 { font-size:20px; margin:0 0 16px }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:16px; margin-bottom:14px }
  .card.off { opacity:.45; pointer-events:none }
  h2 { font-size:15px; margin:0 0 12px }
  h2 span { display:inline-block; width:22px; height:22px; line-height:22px; text-align:center; border-radius:50%; background:var(--pri); color:#fff; font-size:12px; margin-right:8px }
  label { display:block; font-size:12px; color:var(--mut); margin-bottom:3px }
  input, select { width:100%; padding:7px 9px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--tx); font:inherit }
  input[type=checkbox] { width:auto; margin-right:6px }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px }
  button { padding:8px 16px; border:0; border-radius:6px; background:var(--pri); color:#fff; font:inherit; cursor:pointer }
  button.sec { background:transparent; color:var(--pri); border:1px solid var(--pri) }
  button:disabled { opacity:.5; cursor:wait }
  .row { display:flex; gap:10px; align-items:flex-end; margin-top:12px; flex-wrap:wrap }
  .msg { margin-top:10px; padding:8px 10px; border-radius:6px; white-space:pre-wrap }
  .msg.ok { background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok) }
  .msg.bad { background:color-mix(in srgb,var(--bad) 15%,transparent); color:var(--bad) }
  table { border-collapse:collapse; width:100% }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--bd); vertical-align:middle }
  th { font-size:12px; color:var(--mut) }
  td select { padding:4px 6px }
  .tag { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--bd); color:var(--mut); margin-left:4px }
  .tag.req { color:var(--bad); border-color:var(--bad) }
  .tag.id { color:var(--warn); border-color:var(--warn) }
  .scroll { overflow-x:auto }
  .prev td, .prev th { font-size:12px; white-space:nowrap }
  small { color:var(--mut) }
</style>
</head>
<body>
<main>
<h1>Import Excel → SQL Server</h1>

<section class="card" id="s1">
  <h2><span>1</span>Kết nối server</h2>
  <div class="grid">
    <div><label>Server Name (vd: host,2268)</label><input id="server"></div>
    <div><label>Username (để trống = Windows Auth)</label><input id="user" autocomplete="off"></div>
    <div><label>Password</label><input id="pass" type="password" autocomplete="off"></div>
  </div>
  <div class="row"><button id="btnConn">Kết nối</button></div>
  <div id="m1"></div>
</section>

<section class="card off" id="s2">
  <h2><span>2</span>Chọn database & bảng đích</h2>
  <div class="grid">
    <div><label>Database</label><select id="db"></select></div>
    <div><label>Bảng đích (gõ để lọc)</label><input id="table" list="tbls" placeholder="dbo.CDXE"></div>
  </div>
  <datalist id="tbls"></datalist>
  <div id="m2"></div>
</section>

<section class="card off" id="s3">
  <h2><span>3</span>Đẩy file Excel (.xlsx)</h2>
  <div class="grid">
    <div><label>File</label><input id="file" type="file" accept=".xlsx,.xlsm"></div>
    <div><label>Sheet</label><select id="sheet"></select></div>
    <div><label>Dòng header</label><input id="hrow" type="number" min="1" value="1"></div>
  </div>
  <div id="m3"></div>
  <div class="scroll prev" id="prev"></div>
</section>

<section class="card off" id="s4">
  <h2><span>4</span>Mapping cột</h2>
  <div class="scroll"><table id="map"><thead><tr><th>Cột bảng đích</th><th>Kiểu</th><th>Cột Excel</th><th>Hoặc giá trị cố định</th></tr></thead><tbody></tbody></table></div>
  <div style="margin-top:12px">
    <label style="display:inline-block"><input type="checkbox" id="trunc">Xóa sạch bảng trước khi import (DELETE)</label><br>
    <label style="display:inline-block" id="idl"><input type="checkbox" id="idins">Ghi đè cột identity (IDENTITY_INSERT)</label>
  </div>
  <div class="row">
    <button class="sec" id="btnCheck">Kiểm tra dữ liệu (không ghi)</button>
    <button id="btnImp">Import</button>
  </div>
  <div id="m4"></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const on = (id, on) => $(id).classList.toggle('off', !on);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const show = (id, ok, txt) => { $(id).innerHTML = txt ? `<div class="msg ${ok?'ok':'bad'}">${esc(txt)}</div>` : ''; };
async function post(url, body, form) {
  const r = await fetch(url, form ? {method:'POST', body:form}
    : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return r.json();
}
let excelCols = [], tableCols = [];

$('btnConn').onclick = async () => {
  $('btnConn').disabled = true; show('m1', true, 'Đang kết nối...');
  const j = await post('/api/connect', {server:$('server').value, user:$('user').value, password:$('pass').value});
  $('btnConn').disabled = false;
  if (!j.ok) return show('m1', false, j.error);
  show('m1', true, `Kết nối OK — ${j.databases.length} database`);
  $('db').innerHTML = '<option value="">-- chọn --</option>' + j.databases.map(d => `<option>${esc(d)}</option>`).join('');
  on('s2', true);
};

$('db').onchange = async () => {
  on('s3', false); on('s4', false); $('table').value = '';
  if (!$('db').value) return;
  const j = await post('/api/tables', {database:$('db').value});
  if (!j.ok) return show('m2', false, j.error);
  show('m2', true, `${j.tables.length} bảng`);
  $('tbls').innerHTML = j.tables.map(t => `<option value="${esc(t)}">`).join('');
};

$('table').onchange = () => { if ($('table').value.trim()) on('s3', true); if (excelCols.length) loadColumns(); };

async function upload(withFile) {
  const fd = new FormData();
  if (withFile) fd.append('file', $('file').files[0]);
  fd.append('sheet', withFile ? '' : $('sheet').value);
  fd.append('header_row', $('hrow').value);
  const j = await post('/api/upload', null, fd);
  if (!j.ok) return show('m3', false, j.error);
  excelCols = j.columns;
  $('sheet').innerHTML = j.sheets.map(s => `<option ${s===j.sheet?'selected':''}>${esc(s)}</option>`).join('');
  show('m3', true, `${j.n_rows} dòng, ${j.columns.length} cột`);
  $('prev').innerHTML = '<table><thead><tr>' + j.columns.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>'
    + j.preview.map(r => '<tr>' + r.map(v => `<td>${esc(v)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
  loadColumns();
}
$('file').onchange = () => $('file').files[0] && upload(true);
$('sheet').onchange = () => upload(false);
$('hrow').onchange = () => $('file').files[0] && upload(false);

async function loadColumns() {
  const j = await post('/api/columns', {table:$('table').value.trim()});
  if (!j.ok) { on('s4', false); return show('m3', false, j.error); }
  tableCols = j.columns;
  const opts = '<option value="">(bỏ qua)</option>' + excelCols.map((c,i) => `<option value="${i}">${esc(c)}</option>`).join('');
  $('map').tBodies[0].innerHTML = tableCols.map((c,k) => {
    const req = !c.nullable && !c.has_default && !c.identity;
    const len = c.max_len > 0 && /char/.test(c.type) ? `(${c.max_len})` : c.max_len === -1 ? '(max)' : /^(decimal|numeric)$/.test(c.type) ? `(${c.precision},${c.scale})` : '';
    return `<tr><td>${esc(c.name)}${req?'<span class="tag req">bắt buộc</span>':''}${c.identity?'<span class="tag id">identity</span>':''}</td>
      <td><small>${c.type}${len}</small></td>
      <td><select data-col="${esc(c.name)}">${opts}</select></td>
      <td><input data-const="${esc(c.name)}" placeholder="vd: 01" ${c.identity?'disabled':''}></td></tr>`;
  }).join('');
  document.querySelectorAll('#map select').forEach((s,k) => {
    const g = tableCols[k].suggest; if (g != null && !(tableCols[k].identity)) s.value = g;
    const inp = s.closest('tr').querySelector('input');
    const sync = () => { inp.disabled = s.value !== '' || tableCols[k].identity; if (inp.disabled) inp.value = ''; };
    s.onchange = sync; sync();
  });
  $('idl').style.display = tableCols.some(c => c.identity) ? '' : 'none';
  show('m4', true, ''); on('s4', true);
}

function payload(dry) {
  const mapping = {};
  document.querySelectorAll('#map select').forEach(s => { if (s.value !== '') mapping[s.dataset.col] = s.value; });
  const constants = {};
  document.querySelectorAll('#map input[data-const]').forEach(i => { if (i.value !== '') constants[i.dataset.const] = i.value; });
  return {mapping, constants, truncate:$('trunc').checked, identity_insert:$('idins').checked, dry_run:dry};
}
async function run(dry) {
  if (!dry && $('trunc').checked && !confirm('Sẽ XÓA SẠCH bảng ' + $('table').value + ' trước khi import. Chắc chưa?')) return;
  $('btnImp').disabled = $('btnCheck').disabled = true; show('m4', true, 'Đang chạy...');
  const j = await post('/api/import', payload(dry));
  $('btnImp').disabled = $('btnCheck').disabled = false;
  if (j.ok) return show('m4', true, dry ? `Dữ liệu hợp lệ — ${j.rows} dòng sẵn sàng import.` : `Đã import ${j.rows} dòng vào ${$('table').value}.`);
  let t = j.error;
  if (j.errors) t += '\n' + j.errors.map(e => `• Dòng Excel ${e.row}, cột ${e.col}: ${e.msg}`).join('\n');
  if (j.bad_row) t += `\n• Dòng gây lỗi: Excel dòng ${j.bad_row.row} — ${j.bad_row.msg}`;
  show('m4', false, t);
}
$('btnCheck').onclick = () => run(true);
$('btnImp').onclick = () => run(false);
</script>
</body>
</html>
